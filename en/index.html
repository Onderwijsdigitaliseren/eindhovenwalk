<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Filament – Eindhoven city walk</title>
<meta name="description" content="The Filament: a puzzle walk of 1, 1.5 or 2 hours through Eindhoven city centre, past Philips, PSV, the Blob, the Effenaar and more.">
<meta property="og:title" content="The Filament – Eindhoven city walk">
<meta property="og:image" content="../img/og.jpg">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#10121a; --bg2:#181b27; --card:#1f2333; --line:#2e3348;
  --ink:#f3ecdc; --dim:#a9a595; --amber:#ffb84a; --amber2:#ff8f2e; --ok:#7fd69a; --bad:#ff7b6b;
  --serif:Georgia,"Times New Roman",serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(900px 500px at 50% -120px,#3a2a12 0,transparent 70%),var(--bg)}
#app{max-width:580px;margin:0 auto;padding:18px 16px 96px}
h1,h2,h3{font-family:var(--serif);font-weight:normal;margin:0 0 .4em;line-height:1.2}
h1{font-size:2.3rem;letter-spacing:.01em}
h2{font-size:1.55rem}
h3{font-size:1.1rem;color:var(--amber)}
p{margin:.55em 0}
a{color:var(--amber)}
.kicker{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.dim{color:var(--dim)} .small{font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font:inherit;font-weight:600;cursor:pointer;
  background:linear-gradient(180deg,var(--amber),var(--amber2));color:#2a1700;margin:10px 0}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{display:inline-block;width:auto;padding:9px 13px;font-size:.9rem;margin:4px 6px 4px 0}
.btn:focus-visible,input:focus-visible,.opt:focus-visible,.cell:focus-visible,.chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bulb{width:74px;height:74px;margin:6px auto 10px;display:block;filter:drop-shadow(0 0 18px rgba(255,184,74,.75))}
.variant{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin:10px 0;color:var(--ink);font:inherit;cursor:pointer}
.variant b{font-family:var(--serif);font-size:1.25rem;font-weight:normal;color:var(--amber)}
.variant span{display:block;color:var(--dim);font-size:.9rem;margin-top:3px}
.variant:hover{border-color:var(--amber)}
.quote{font-family:var(--serif);font-style:italic;border-left:3px solid var(--amber);padding:4px 0 4px 14px;margin:14px 0;color:#f7dfb4}
.quote small{display:block;font-style:normal;font-family:var(--sans);color:var(--dim);margin-top:4px;font-size:.78rem;letter-spacing:.04em}
ul.facts{padding-left:1.1em;margin:.4em 0}
ul.facts li{margin:.5em 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:#33384d}
.dot.on{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
#map{width:100%;height:auto;background:#151826;border:1px solid var(--line);border-radius:14px;display:block}
.maplbl{font:600 11px var(--sans);fill:#cfc9b8}
.strl{font:500 10px var(--sans);fill:#7d8299}
.plbl{font:700 11.5px var(--sans);fill:#fff;paint-order:stroke;stroke:#151826;stroke-width:3.5px;stroke-linejoin:round}
.mapbox{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#141826;min-height:240px}
.mapbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(24,27,39,.92);color:var(--ink);font-size:1.2rem;cursor:pointer;padding:0}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#f3ecdc;color:#1a1300;padding:10px 16px;border-radius:999px;font-size:.92rem;z-index:9;display:none;max-width:90vw;text-align:center}
.ava{float:right;width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 0 6px 10px;border:2px solid var(--amber)}
.pic{display:block;width:100%;height:auto;max-height:72vh;border-radius:14px;margin:10px 0;object-fit:cover;background:#0c0e15}
.hero{display:block;width:100%;border-radius:16px;margin:0 0 14px;aspect-ratio:4/5;object-fit:cover}
.testbtn{border-style:dashed!important;color:var(--dim)!important}
.q{font-family:var(--serif);font-size:1.18rem;margin:.2em 0 .7em}
input.ans{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0c0e15;color:var(--ink);font:inherit;font-size:1.15rem}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0c0e15;color:var(--ink);font:inherit;margin:8px 0;cursor:pointer}
.opt.wrong{border-color:var(--bad);opacity:.6}
.fb{min-height:1.4em;font-weight:600;margin:8px 0}
.fb.bad{color:var(--bad)} .fb.ok{color:var(--ok)}
.hint{background:#261f10;border:1px dashed #6b5320;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.45rem;letter-spacing:.14em;text-align:center;background:#0c0e15;border-radius:12px;padding:14px 8px;margin:10px 0;color:var(--amber);overflow-wrap:anywhere}
.tbl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:8px 0}
.tbl div{background:#0c0e15;border-radius:5px;text-align:center;padding:3px 0}
.tbl div b{display:block;color:var(--amber)}
.morse{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
.morse div{background:#0c0e15;border-radius:6px;padding:4px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:14px auto}
.cell{aspect-ratio:1;border-radius:50%;border:2px solid #4a4f66;background:#0c0e15;cursor:pointer;padding:0}
.cell.on{background:radial-gradient(circle at 50% 40%,#fff3c9,var(--amber) 55%,var(--amber2));border-color:#ffe2a6;box-shadow:0 0 22px rgba(255,184,74,.8)}
.lamp{display:flex;gap:12px;align-items:center;background:#261f10;border:1px solid #6b5320;border-radius:12px;padding:10px 12px;margin:12px 0}
.lamp .yr{font-family:var(--serif);font-size:1.6rem;color:var(--amber);min-width:3.2em}
.word{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:14px 0}
.slot{width:30px;height:40px;border-bottom:2px solid var(--amber);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.5rem;color:var(--amber)}
.slot.gap{border:0;width:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:#0c0e15;color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer}
.chip.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(16,18,26,.96);border-top:1px solid var(--line);display:none;justify-content:center;gap:8px;padding:8px}
#bar button{flex:1;max-width:190px;margin:0}
#sheet{position:fixed;inset:0;background:rgba(5,6,10,.8);display:none;z-index:5;overflow:auto;padding:16px}
#sheet .inner{max-width:560px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:8px 0}
.row .yr{font-family:var(--serif);color:var(--amber);min-width:3.4em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"><button class="btn ghost sm" id="bSchrift">📓 Notes</button><button class="btn ghost sm" id="bMap">🗺 Map</button><button class="btn ghost sm" id="bMenu">⋯ Menu</button></div>
<div id="sheet"><div class="inner" id="sheetIn"></div></div>

<script src="../shared/tiles.js?v=1"></script>
<script>
/* =====================================================================
   DE GLOEIDRAAD – stadswandeling Eindhoven
   Opbouw: STOPS (inhoud per plek) · ROUTES (3 varianten) · toestand · schermen
   Kader (Tonnie) is verzonnen; alle feiten bij de plekken zijn echt.
   ===================================================================== */

const STOPS = {
bk:{ name:'De Bijenkorf', short:'Bijenkorf', lat:51.44215, lng:5.47690, maps:'De Bijenkorf Eindhoven',
  year:1969, yearWhy:'opening van de Bijenkorf',
  walk:'Je staat er al: het 18 Septemberplein, met de groene gevel van de Bijenkorf.',
  tonnie:'Begin waar het groen is. Een Italiaan keek uit een vliegtuigraampje naar onze weilanden en maakte er een warenhuis van.',
  info:[
   'Het plein heet naar <b>18 september 1944</b>, de dag waarop Eindhoven werd bevrijd. De rest van Nederland moest daar grotendeels nog tot mei 1945 op wachten.',
   'De Bijenkorf ging open op <b>18 maart 1969</b> en was het eerste filiaal buiten de Randstad. De ontwerper was de Milanees <b>Gio Ponti</b>, die ook bestek, meubels en zelfs een carrosserie voor Alfa Romeo tekende.',
   'In 1964 vloog Ponti naar Eindhoven. Het polderlandschap onder hem, groene velden met sloten eromheen, werd zijn gevel: groen geglazuurde keramische tegels.'],
  puzzle:{type:'num', q:'Ponti is van 1891. Dat is precies het jaar waarin een paar straten verderop een klein gloeilampenfabriekje begon. Hoe oud was dat bedrijf in het jaar dat de Bijenkorf openging?', answer:78,
   hints:['De Bijenkorf opende in 1969.','1969 − 1891.']},
  afterBank:'Onthoud 1891: dat fabriekje kom je in de echte wandeling tegen. Op de foto zie je het al een beetje: de tegels van de gevel zijn niet overal even groen.',
  after:'Onthoud 1891, dat fabriekje kom je nog tegen. Loop voor je verdergaat even dicht langs de gevel: de tegels hebben reliëf en geen twee vlakken zijn precies even groen.' },

blob:{ name:'De Blob', short:'Blob', lat:51.44130, lng:5.47610, maps:'De Blob Eindhoven',
  year:2010, yearWhy:'de Blob is klaar',
  walk:'Steek het plein over naar de glazen bult aan de kant van de Emmasingel.',
  tonnie:'In mijn tijd was glas iets waar je een gloeidraad in stopte. Nu wonen er winkels in.',
  info:[
   'Officieel is dit het entreegebouw van winkelgebied de Admirant. Iedereen zegt <b>de Blob</b>. Het ontwerp is van de Italiaan <b>Massimiliano Fuksas</b> en is van staal en glas.',
   'Fuksas tekende ook het plein zelf, de glazen overkapping bij de Bijenkorf en de fietsenstalling onder je voeten.',
   'De naam komt van “blob-architectuur”: vloeiende vormen die pas met de computer te tekenen waren. Aan de overkant van het plein staat sinds 2013 een kleiner zusje, de Bubble, van een andere architect.'],
  puzzle:{type:'num', q:'In computertaal is een BLOB een Binary Large OBject. Binair dus: de Blob is 11001 meter hoog. Hoeveel meter is dat in gewone getallen?', answer:25,
   hints:['Elke plek is van rechts naar links 1, 2, 4, 8 en 16 waard.','16 + 8 + 0 + 0 + 1.']},
  after:'25 meter hoog, met een huid van zo’n 1.500 ruiten. Kijk goed: ze zijn allemaal driehoekig.' },

lt:{ name:'De Lichttoren', short:'Lichttoren', lat:51.44125, lng:5.47500, maps:'Lichttoren Eindhoven',
  year:1921, yearWhy:'de Lichttoren in gebruik',
  walk:'Aan de overkant van de Emmasingel staat een witte toren. Loop ernaartoe.',
  tonnie:'Hier werkte ik. Mijn werk was wachten tot een lamp doodging en dan opschrijven hoe laat het was.',
  info:[
   'Dit complex is tussen <b>1909 en 1921</b> in delen gebouwd als gloeilampenfabriek van Philips. De toren kwam er in 1921 bij en was toen de eerste hoogbouw van de stad: 48 meter.',
   'In de toren deed Philips <b>duurproeven</b>. Lampen brandden er dag en nacht om te meten hoe lang ze het volhielden. Daardoor straalde de toren ’s nachts over de stad, en zo kwam hij aan zijn naam.',
   'Het is nu een rijksmonument met onder meer een hotel. Tijdens lichtfestival GLOW, elk jaar in november, is de witte gevel een projectiescherm.'],
  puzzle:{type:'num', q:'Kijk omhoog of loop een stukje om de toren heen. Hoeveel hoeken heeft hij?', answer:7,
   hints:['Het is er geen zes en geen acht.','De toren is een heptagoon.'],
   bank:{q:'Vanaf de bank kun je niet om de toren heen lopen. Daarom zo: de Lichttoren is een heptagoon. Hoeveel hoeken heeft hij?', hints:['Hepta is Grieks voor een getal.','Een hexagoon heeft er zes. Dit is er één meer.']}},
  after:'Zeven hoeken: een heptagoon. Dat zie je in de bouw bijna nooit.' },

ger:{ name:'Gerard Philips in het Victoriapark', short:'Gerard', lat:51.44030, lng:5.47290, maps:'Victoriapark Eindhoven',
  year:2023, yearWhy:'het beeld van Gerard onthuld',
  walk:'Loop om de Lichttoren heen naar het park erachter, het Victoriapark. Zoek het grootste hoofd van Eindhoven.',
  tonnie:'Meneer Gerard was de uitvinder, zijn broer Anton de verkoper. De verkoper kreeg als eerste een standbeeld. Zo gaat dat.',
  info:[
   '<b>Gerard Philips</b> (1858–1942), geboren in Zaltbommel, begon het bedrijf in 1891 samen met zijn vader Frederik. Zijn broer Anton en neef Frits hadden al lang een standbeeld; Gerard niet.',
   'Dit beeld heet <b>Poort naar de Toekomst</b> en is gemaakt door Andreas Hetfeld. Het was een cadeau van Philips aan de stad voor het 130-jarig bestaan. Het bestaat uit 4.659 losse onderdelen, weegt 23.000 kilo en je kunt erdoorheen lopen.',
   'Het werd in mei 2023 onthuld op Strijp-T en staat sinds 2025 hier. In hetzelfde park is het beekje de Gender, dat jarenlang onder de grond zat, over 220 meter weer bovengehaald.'],
  puzzle:{type:'num', q:'Het beeld is 7 meter hoog en gestapeld uit 500 lagen staal. Hoe dik is één laag gemiddeld, in millimeters?', answer:14,
   hints:['7 meter is 7.000 millimeter.','7.000 : 500.']},
  after:'Veertien millimeter per laag. Loop er gerust doorheen: de opening is acht meter breed.' },

psv:{ name:'Philips Stadion', short:'PSV', lat:51.44160, lng:5.46870, maps:'Philips Stadion Eindhoven',
  year:1913, yearWhy:'PSV opgericht',
  walk:'Volg de Mathildelaan naar het westen. Het stadion kun je niet missen.',
  tonnie:'Op zondag stonden we hier met de hele afdeling. Wie verloor had maandag de slechtste lampen.',
  info:[
   'PSV is de <b>Philips Sport Vereniging</b>, opgericht op <b>31 augustus 1913</b> als sportclub van en voor het personeel. Aanleiding was een feest voor honderd jaar onafhankelijk Nederland.',
   'De club speelt sinds het begin op deze plek. De aftrap van de eerste wedstrijd was van een jongetje van acht: <b>Frits Philips</b>.',
   'Frits bleef zijn leven lang komen en maakte alle achttien landstitels tot en met 2005 mee. Buiten het stadion staan beelden van clubhelden Willy van der Kuijlen en Coen Dillen. Bijnamen van de club: de Boeren en de Lampen.'],
  puzzle:{type:'num', q:'Frits deed de aftrap in 1913 en zag PSV in 2005 nog kampioen worden. Hoeveel jaar zat er tussen die aftrap en die laatste titel?', answer:92,
   hints:['Je hebt alleen de twee jaartallen nodig.','2005 − 1913.']},
  after:'Tweeënnegentig jaar dezelfde club, op dezelfde plek. Loop nu terug richting de Lichttoren.' },

wd:{ name:'De Witte Dame', short:'Witte Dame', lat:51.43960, lng:5.47440, maps:'De Witte Dame Eindhoven',
  year:1931, yearWhy:'de Witte Dame voltooid',
  walk:'Loop terug naar de Emmasingel. Het lange witte fabrieksgebouw naast de Lichttoren is de Witte Dame.',
  walkFrom:{lt:'Loop de Emmasingel af. Het lange witte fabrieksgebouw naast de Lichttoren is de Witte Dame.'},
  tonnie:'Verdiepingen vol meisjes aan lange tafels. Wij noemden het de buizenfabriek.',
  info:[
   'Architect <b>Dirk Roosenburg</b> bouwde dit tussen 1928 en 1931 voor Philips. Er werden onder meer radiobuizen gemaakt.',
   'Op <b>6 december 1942</b> bombardeerde de Britse luchtmacht de Philipsfabrieken, omdat de bezetter er onderdelen voor militaire radio’s liet maken. Dit “Sinterklaasbombardement” trof ook de stad eromheen; meer dan honderd burgers kwamen om.',
   'Toen Philips vertrok, dreigde sloop. In 1998 ging het gebouw opnieuw open. De Design Academy Eindhoven zit er nu in.'],
  puzzle:{type:'text', q:'Zij is wit en heet de Dame. Aan de overkant staat haar partner: het voormalige hoofdkantoor van Philips, in donkere baksteen. Hoe noemen Eindhovenaren hem?', accept:['bruineheer','debruineheer','heer','deheer'], show:'De Bruine Heer',
   hints:['Kijk naar de kleur van het gebouw aan de overkant.','Zij is een dame, hij is een …']},
  after:'De Witte Dame en de Bruine Heer staan al bijna een eeuw tegenover elkaar.' },

fab:{ name:'Het eerste fabriekje', short:'Eerste fabriek', lat:51.43905, lng:5.47565, maps:'Philips Museum Eindhoven',
  year:1891, yearWhy:'begin van Philips',
  walk:'Loop de Emmasingel verder af tot nummer 31: het Philips Museum.',
  tonnie:'Hier is het begonnen, in een oud fabriekje. Geen toren, geen stadion. Een werkbank en een pomp om lucht uit glas te zuigen.',
  info:[
   'Op <b>15 mei 1891</b> begon Gerard Philips hier met geld van zijn vader een gloeilampenfabriek. Eindhoven had toen zo’n 4.500 inwoners. Grond en arbeid waren er goedkoop.',
   'De eerste lampen hadden een <b>kooldraad</b>. Het ging pas goed lopen toen Gerards jongere broer Anton in 1895 de verkoop kwam doen.',
   'Het gebouwtje is bewaard gebleven en is nu het Philips Museum.'],
  puzzle:{type:'lights', q:'Tonnies werkbank. Krijg alle negen lampen aan. Let op: elke schakelaar zet ook de lampen ernaast om.',
   hints:['Het kan altijd. Werk rij voor rij: gebruik de tweede rij om de eerste rij goed te krijgen.','Kom je er niet uit, dan mag je hieronder de werkbank laten oplossen.']},
  after:'Negen lampen. In 1891 was één lamp die een avond bleef branden al goed nieuws.' },

frits:{ name:'Meneer Frits op de Markt', short:'Meneer Frits', lat:51.43905, lng:5.47830, maps:'Standbeeld Frits Philips Markt Eindhoven',
  year:1905, yearWhy:'Frits Philips geboren',
  walk:'Loop het winkelgebied in naar het oosten, tot je op de Markt staat. Zoek daar een bronzen heer.',
  tonnie:'Meneer Frits kende je naam. Dat was vervelend als je iets fout had gedaan en fijn op alle andere dagen.',
  info:[
   '<b>Frits Philips</b> was de zoon van Anton en werd later zelf de baas. In de stad heette hij “meneer Frits”, omdat hij met arbeiders net zo makkelijk praatte als met directeuren.',
   'In de oorlog bleef hij als enige van de directie in Nederland. Hij wist <b>382 Joodse werknemers</b> te redden door ze onmisbaar te verklaren voor de productie. Yad Vashem eerde hem daarvoor in 1996.',
   'Het beeld is van Kees Verkade en is betaald door burgers, instellingen en bedrijven uit de regio. Voor zijn laatste verjaardag heette Eindhoven zelfs even Frits Philips Stad.'],
  puzzle:{type:'num', q:'Zoek het naambordje bij het beeld. Er staan twee jaartallen op. Hoe oud is meneer Frits geworden?', answer:100,
   hints:['Trek het eerste jaartal van het tweede af.','Hij leefde van 1905 tot 2005.']},
  after:'Honderd jaar. Hij maakte de gloeilamp, de radio, de televisie, de cassette en de cd allemaal van dichtbij mee.' },

kerk:{ name:'De Catharinakerk', short:'Catharinakerk', lat:51.43690, lng:5.47975, maps:'Sint-Catharinakerk Eindhoven',
  year:1867, yearWhy:'de Catharinakerk voltooid',
  walk:'Neem vanaf de Markt de Rechtestraat naar het zuiden. Aan het eind zie je twee kerktorens.',
  tonnie:'Kijk eens goed naar die twee torens. Mijn moeder zei: zelfs een tweeling is nooit hetzelfde.',
  info:[
   'Deze neogotische kerk is gebouwd tussen <b>1859 en 1867</b>. Ze stond er dus al toen Philips nog moest beginnen en Eindhoven een stadje van een paar duizend mensen was.',
   'De architect keek naar Franse kathedralen als Chartres en Reims. De twee torens zijn met opzet <b>niet gelijk</b>. Zoek de verschillen.',
   'Het was een van zijn vroege grote werken. Daarna werd hij de bekendste bouwmeester van Nederland.'],
  puzzle:{type:'choice', q:'De architect heet Pierre Cuypers. Welke twee gebouwen in Amsterdam, waar bijna elke toerist langskomt, tekende hij later ook?',
   options:['Het Paleis op de Dam en de Westerkerk','Het Rijksmuseum en het Centraal Station','Het Concertgebouw en het Stedelijk Museum','De Beurs en Tuschinski'], correct:1,
   hints:['Het ene gebouw hangt vol Rembrandts.','Bij het andere stap je uit de trein.']},
  after:'Het Rijksmuseum en Amsterdam Centraal. Eindhoven had zijn Cuypers eerder.' },

monu:{ name:'Het Bevrijdingsmonument', short:'Bevrijdingsmonument', lat:51.43655, lng:5.47800, maps:'Bevrijdingsmonument Stadhuisplein Eindhoven',
  year:1944, yearWhy:'Eindhoven bevrijd',
  walk:'Loop vanaf de kerk naar het westen, naar het Stadhuisplein. Het bronzen monument staat op het plein.',
  tonnie:'Die avond zetten we alles wat licht gaf voor het raam. Na vier jaar verduisteren.',
  info:[
   'Op <b>18 september 1944</b> bevrijdde de Amerikaanse 101st Airborne Division de stad, als onderdeel van operatie Market Garden. Het monument van Paul Grégoire werd precies tien jaar later onthuld.',
   'Elk jaar op 18 september komt hier het <b>bevrijdingsvuur</b> aan, door fietsers opgehaald in Bayeux in Normandië. De burgemeester steekt er de fakkel mee aan. Dat is ook het startsein voor de <b>Lichtjesroute</b>: 22 kilometer lichtornamenten door de stad.',
   'Rond het monument staan de namen van Eindhovense oorlogsslachtoffers. In 2023 bleek dat er ook SS’ers en NSB’ers tussen stonden. Die 22 namen zijn weggehaald en 155 ontbrekende slachtoffers kwamen erbij.'],
  puzzle:{type:'text', cipher:18, q:'Tonnie schreef hier één woord in geheimschrift. Hij schoof elke letter 18 plaatsen op in het alfabet, naar de dag van de bevrijding. Schuif terug.', code:'TWNJABV', accept:['bevrijd'], show:'BEVRIJD',
   hints:['De T was eerst een B.','Gebruik de tabel hieronder: zoek de codeletter in de onderste rij en lees de letter erboven.']},
  after:'Bevrijd. De traditie van de lichtjes begon in 1945, toen bewoners bij de eerste herdenking kaarsen en lampjes achter hun ramen zetten.' },

dyn:{ name:'Dynamo', short:'Dynamo', lat:51.43767, lng:5.48055, maps:'Dynamo Eindhoven Catharinaplein',

  info:[
   'Dynamo is het jongerencentrum van Eindhoven. De rockclub begon in <b>1981</b>. Het huidige gebouw is van 2005.',

   'In <b>1995</b> stond het festival op vliegbasis Welschap en kwamen er 118.000 bezoekers. Het is nog altijd het grootste meerdaagse openluchtfestival dat Nederland heeft gehad. De wegen rond de stad stonden muurvast.'],
  puzzle:{type:'choice', q:'Van parkeerterrein in 1986 naar vliegbasis in 1995. Hoeveel keer zo groot was het publiek geworden?',
   options:['Ongeveer 6 keer','Ongeveer 12 keer','Bijna 24 keer','Bijna 48 keer'], correct:2,

strat:{ name:'Stratumseind', short:'Stratumseind', lat:51.43530, lng:5.48060, maps:'Stratumseind Eindhoven',
  year:2014, yearWhy:'Stratumseind wordt Living Lab',
  walk:'Bij de kerk begint het Stratumseind. Loop de straat helemaal uit, tot aan het water van de Dommel.',
  tonnie:'Vroeger keken alleen de buren naar je als je naar huis zwalkte. Nu kijkt de lantaarnpaal ook.',
  info:[

   'Het bekendste experiment gaat over licht. Onderzoekers van de TU/e en Philips testen hier of je met de kleur en sterkte van de straatverlichting de stemming kunt bijsturen als het uit de hand dreigt te lopen. Niet iedereen is blij met zoveel meten; over de privacy is veel discussie.'],
  puzzle:{type:'num', q:'Zo’n 50 cafés op 300 meter. Om de hoeveel meter staat er gemiddeld een kroeg?', answer:6,

daf:{ name:'DAF Museum', short:'DAF', lat:51.43723, lng:5.49046, maps:'DAF Museum Eindhoven',
  year:1928, yearWhy:'Hub van Doorne begint zijn werkplaats',
  walk:'Dit is het langste stuk, ruim tien minuten. Loop terug richting de kerk en ga dan naar het oosten, via de Ten Hagestraat en de Kanaalstraat naar de Tongelresestraat 27. Volg anders de knop “Open in Maps”.',
  tonnie:'Hub kwam bij ons lassen als wij het zelf niet konden. Een smid uit Limburg. Later reed half Nederland in zijn autootjes.',
  info:[
   'Op <b>1 april 1928</b> begon Hub van Doorne hier een werkplaats met vier man, in een hoekje van een bierbrouwerij.',
   'Dat kwam door een kapotte auto. De brouwer had een Amerikaanse Stearns-Knight die niemand aan de praat kreeg, behalve Hub. De brouwer leende hem daarna 10.000 gulden en de ruimte om voor zichzelf te beginnen.',
   'Eerst deed hij las- en smeedwerk, ook voor Philips. Het museum zit in de oude brouwerij en de eerste werkplaats is bewaard gebleven.'],
  puzzle:{type:'text', q:'DAF betekent nu Van Doorne’s Automobiel Fabriek. Maar tot 1949 stond de A voor iets wat je áchter een auto hangt. Welk woord?', accept:['aanhangwagen','aanhangwagens','aanhangwagenfabriek','aanhanger','aanhangers'], show:'Aanhangwagen',

eff:{ name:'De Effenaar', short:'Effenaar', lat:51.44176, lng:5.48321, maps:'Effenaar Eindhoven',
  year:1971, yearWhy:'de Effenaar begint',
  walk:'Loop terug naar het noorden over de Vestdijk en sla rechtsaf de Dommelstraat in. Aan het eind staat de Effenaar.',
  walkFrom:{daf:'Loop de Tongelresestraat terug naar het westen, ga op de Vestdijk naar het noorden en sla rechtsaf de Dommelstraat in. Aan het eind staat de Effenaar.'},
  tonnie:'Eerst weefden ze hier linnen. Toen kwam er een tijd niets. Toen kwamen er jongens met lang haar en een sleutel die ze niet gekregen hadden.',
  info:[
   'Op deze plek stond de linnenfabriek <b>Van den Briel &amp; Verster</b>. Toen die leeg kwam te staan, kocht de gemeente het complex.',
   'In 1970 kraakten jongeren het pand en begonnen er een open jongerencentrum. In <b>1971</b> ging het verder als de <b>Effenaar</b>. In de beginjaren draaide het om maatschappijkritiek; later werd het een van de grote poppodia van het land.',
   'In het oude zaaltje, dat naar bier en sigaretten rook, speelden onder meer de Red Hot Chili Peppers en Bauhaus. In 2005 kwam op dezelfde plek de nieuwbouw van architectenbureau MVRDV: gestapelde dozen, met een zaal voor 1.300 en een voor 400 bezoekers.'],
  puzzle:{type:'text', q:'In dat oude zaaltje stond ook ooit een Britse punkband die maar één studioalbum maakte. Tonnie schreef de naam achterstevoren op.', code:'SLOTSIP XES', accept:['sexpistols','thesexpistols'], show:'Sex Pistols',
   hints:['Lees van rechts naar links.','De eerste drie letters zijn S, E, X.']},

muur:{ name:'De fabrieksmuur en het Inkijkmuseum', short:'Fabrieksmuur', lat:51.44161, lng:5.48448, maps:'Inkijkmuseum Eindhoven',
  year:1849, yearWhy:'linnenfabriek opgericht',
  walk:'Vlak naast de Effenaar, bij Dommelstraat 2A, staat nog een stuk oude fabrieksmuur met een informatiebord, en een klein gebouwtje.',
  tonnie:'Vóór de lamp was Eindhoven van het linnen, de sigaren en de lucifers. Deze muur weet dat nog.',
  info:[
   'De linnenfabriek van Van den Briel &amp; Verster werd opgericht in <b>1849</b>, ruim veertig jaar vóór Philips. Van het complex staat alleen dit nog overeind.',
   'Het kleine gebouw was het <b>washuis</b> van de fabriek. Later was het onder meer fietsenstalling van de politie en hoorde het bij de Effenaar.',
   'Sinds 2004 is het het <b>Inkijkmuseum</b>. Je gaat er niet naar binnen: je kijkt van buiten door de ramen naar wisselende tentoonstellingen.'],
  puzzle:{type:'num', q:'Zoek op het informatiebord het bouwjaar van de muur. Hoeveel jaar bestond de fabriek toen al?', answer:39,
   hints:['De fabriek is van 1849.','De muur is van 1888.']},
  after:'Negenendertig jaar. Kijk ook even door de ramen van het washuis.' },

silly:{ name:'De Silly Walks-tunnel', short:'Silly Walks', lat:51.44330, lng:5.48520, maps:'Silly Walks Tunnel Eindhoven',
  year:2016, yearWhy:'tunnel geopend door John Cleese',

ath:{ name:'De kernreactor van de TU/e', short:'Kernreactor', lat:51.44620, lng:5.48700, maps:'Athene TU Eindhoven',
  year:1973, yearWhy:'reactor definitief gesloten',
  walk:'Na de tunnel loop je de campus op. Zoek het gebouw <b>Athene</b>, aan de zuidkant van de campus bij de gebouwen Helix en Matrix. Het staat op de campusborden.',
  tonnie:'Ze zeiden dat het veilig was. Ik heb toch maar een straatje omgelopen.',
  info:[
   'De Technische Hogeschool Eindhoven, nu de TU/e, had een <b>eigen kernreactor</b>: ATHENE. Rector Posthumus wilde er vanaf 1960 een hebben voor onderwijs en onderzoek. Het ontwerp kwam van het Reactor Centrum Nederland in Petten.',
   'De bouw begon in 1966 en begin 1969 draaide de reactor. Al anderhalf jaar later adviseerde de Wetenschappelijke Raad voor de Kernenergie om hem te sluiten: hij leverde te weinig op voor de wetenschap. Na <b>mei 1973</b> was het voorbij.',
   'Het vermogen was heel laag en hij had kort gedraaid, dus er bleef vrijwel geen besmet materiaal achter. De anderhalve kilo hoogverrijkt uranium ging naar Mol in België. Het gebouw heet nog altijd Athene.'],
  puzzle:{type:'num', q:'Een rekensom uit het reactorlokaal. Een bron straalt 1.600 eenheden. Elke 4 jaar halveert dat. Na hoeveel jaar is er nog 100 over?', answer:16,
   hints:['1.600 → 800 → 400 → …','Je moet vier keer halveren. Vier keer 4 jaar.']},
  after:'Zestien jaar. Kernonderzoek is niet weg van de campus: bij instituut DIFFER werken ze nu aan kernfusie. Toe aan een pauze? Iets verderop, in gebouw Luna, zitten studentencafé Hubble en de campus-supermarkt. Ze staan op de kaart.' },

sta:{ name:'Het station en Anton Philips', short:'Station', lat:51.44260, lng:5.47930, maps:'Standbeeld Anton Philips Stationsplein Eindhoven',

  walk:'Loop via de Dommelstraat en de Stationsweg naar het Stationsplein. Ga voor het station staan, bij het standbeeld.',

  puzzle:{type:'text', morse:true, q:'Radio begon met morse. Dit is de laatste draad in Tonnies schrift. Welk woord staat er?', code:'·−··  ··  −·−·  ····  −', accept:['licht'], show:'LICHT',

const EN = {
bk:{ name:'De Bijenkorf', short:'Bijenkorf', yearWhy:'the Bijenkorf opens',
  walk:'You’re already there: 18 Septemberplein, with the green façade of department store De Bijenkorf.',
  tonnie:'Start where it’s green. An Italian looked out of an aeroplane window at our meadows and turned them into a department store.',
  info:[
   'The square is named after <b>18 September 1944</b>, the day Eindhoven was liberated. Most of the Netherlands had to wait until May 1945.',
   'De Bijenkorf (“the beehive”) opened on <b>18 March 1969</b>, the chain’s first store outside the big western cities. The designer was <b>Gio Ponti</b> from Milan, who also designed cutlery, furniture and even a car body for Alfa Romeo.',
   'In 1964 Ponti flew to Eindhoven. The Dutch polder landscape below him, green fields framed by ditches, became his façade: green glazed ceramic tiles.'],
  puzzle:{type:'num', q:'Ponti was born in 1891. That is exactly the year a small light bulb factory started up a few streets away. How old was that company in the year the Bijenkorf opened?', answer:78,
   hints:['The Bijenkorf opened in 1969.','1969 − 1891.']},
  afterBank:'Remember 1891: you’ll meet that little factory in the real walk. You can already see a hint of it in the photo: the tiles on the façade are not the same green everywhere.',
  after:'Remember 1891, you’ll meet that little factory later. Before you move on, walk close to the façade: the tiles are in relief and no two patches are exactly the same green.' },

blob:{ name:'The Blob', short:'Blob', yearWhy:'the Blob is finished',
  walk:'Cross the square to the glass bulge on the Emmasingel side.',
  tonnie:'In my day, glass was something you put a filament in. Now there are shops living in it.',
  info:[
   'Officially this is the entrance building of the Admirant shopping area. Everybody says <b>the Blob</b>. It was designed by the Italian architect <b>Massimiliano Fuksas</b> and is made of steel and glass.',
   'Fuksas also designed the square itself, the glass canopy next to the Bijenkorf and the bicycle park under your feet.',
   'The name comes from “blob architecture”: flowing shapes that could only be drawn once computers arrived. Since 2013 it has had a little sister across the square, the Bubble, by a different architect.'],
  puzzle:{type:'num', q:'In computing, a BLOB is a Binary Large OBject. So, in binary: the Blob is 11001 metres tall. How many metres is that in ordinary numbers?', answer:25,
   hints:['From right to left the places are worth 1, 2, 4, 8 and 16.','16 + 8 + 0 + 0 + 1.']},
  after:'25 metres tall, with a skin of about 1,500 panes. Look closely: every one of them is a triangle.' },

lt:{ name:'The Lichttoren', short:'Lichttoren', yearWhy:'the Lichttoren comes into use',
  walk:'Across the Emmasingel stands a white tower. Walk over to it.',
  tonnie:'This is where I worked. My job was to wait until a lamp died and then write down what time it was.',
  info:[
   'This complex was built in stages between <b>1909 and 1921</b> as a Philips light bulb factory. The tower was added in 1921 and was the city’s first high-rise: 48 metres.',
   'Philips used the tower for <b>endurance tests</b>. Lamps burned there day and night to measure how long they lasted. So at night the tower shone out over the city, and that is how it got its name: the Light Tower.',
   'It is now a listed monument with, among other things, a hotel. During the GLOW light festival, every November, the white façade becomes a projection screen.'],
  puzzle:{type:'num', q:'Look up, or walk a little way around the tower. How many corners does it have?', answer:7,
   hints:['It isn’t six and it isn’t eight.','The tower is a heptagon.'],
   bank:{q:'From the sofa you can’t walk around the tower. So try this: the Lichttoren is a heptagon. How many corners does it have?', hints:['Hepta is Greek for a number.','A hexagon has six. This is one more.']}},
  after:'Seven corners: a heptagon. You hardly ever see that in a building.' },

ger:{ name:'Gerard Philips in the Victoriapark', short:'Gerard', yearWhy:'the statue of Gerard is unveiled',
  walk:'Walk around the Lichttoren to the park behind it, the Victoriapark. Look for the biggest head in Eindhoven.',
  tonnie:'Mr Gerard was the inventor, his brother Anton the salesman. The salesman got a statue first. That’s how it goes.',
  info:[
   '<b>Gerard Philips</b> (1858–1942), born in Zaltbommel, started the company in 1891 together with his father Frederik. His brother Anton and nephew Frits had had statues for years; Gerard had none.',
   'This sculpture is called <b>Gateway to the Future</b> and was made by Andreas Hetfeld. It was a gift from Philips to the city for the company’s 130th anniversary. It consists of 4,659 separate parts, weighs 23,000 kilos, and you can walk through it.',
   'It was unveiled in May 2023 at Strijp-T and has stood here since 2025. In the same park the little stream the Gender, hidden underground for years, has been brought back to the surface for 220 metres.'],
  puzzle:{type:'num', q:'The sculpture is 7 metres tall and stacked from 500 layers of steel. How thick is one layer on average, in millimetres?', answer:14,
   hints:['7 metres is 7,000 millimetres.','7,000 ÷ 500.']},
  after:'Fourteen millimetres per layer. Do walk through it: the opening is eight metres wide.' },

psv:{ name:'Philips Stadium', short:'PSV', yearWhy:'PSV is founded',
  walk:'Follow the Mathildelaan to the west. You can’t miss the stadium.',
  tonnie:'On Sundays our whole department stood here. Whoever lost got the worst lamps on Monday.',
  info:[
   'PSV stands for <b>Philips Sport Vereniging</b>, the Philips Sports Club, founded on <b>31 August 1913</b> as a club by and for the staff. The occasion was a celebration of a hundred years of Dutch independence.',
   'The club has played on this spot from the start. The kick-off of the first match was taken by a boy of eight: <b>Frits Philips</b>.',
   'Frits kept coming all his life and saw all eighteen national titles up to 2005. Outside the stadium stand statues of club heroes Willy van der Kuijlen and Coen Dillen. The club’s nicknames: the Farmers and the Light Bulbs.'],
  puzzle:{type:'num', q:'Frits took the kick-off in 1913 and still saw PSV become champions in 2005. How many years lay between that kick-off and that last title?', answer:92,
   hints:['You only need the two years.','2005 − 1913.']},
  after:'Ninety-two years with the same club, on the same spot. Now walk back towards the Lichttoren.' },

wd:{ name:'The Witte Dame', short:'Witte Dame', yearWhy:'the Witte Dame is completed',
  walk:'Walk back to the Emmasingel. The long white factory building next to the Lichttoren is the Witte Dame.',
  walkFrom:{lt:'Walk down the Emmasingel. The long white factory building next to the Lichttoren is the Witte Dame.'},
  tonnie:'Floors full of girls at long tables. We called it the valve factory.',
  info:[
   'Architect <b>Dirk Roosenburg</b> built this for Philips between 1928 and 1931. Among other things, radio valves were made here. Witte Dame means White Lady.',
   'On <b>6 December 1942</b> the British air force bombed the Philips factories, because the occupier had parts for military radios made there. This “St Nicholas bombing” also hit the city around them; more than a hundred civilians were killed.',
   'When Philips left, demolition threatened. In 1998 the building reopened. The Design Academy Eindhoven is now based here.'],
  puzzle:{type:'text', q:'She is white and is called the Lady. Across the street stands her partner: the former Philips head office, in dark brick. Locals call him the Brown … what? (The Dutch word is fine too.)', accept:['bruineheer','debruineheer','heer','deheer','gentleman','browngentleman','thebrowngentleman','gent','lord','browngent','mister','mr','debruineheerthebrowngentleman'], show:'De Bruine Heer – the Brown Gentleman',
   hints:['Look at the colour of the building opposite.','She is a lady, he is a …']},
  after:'The White Lady and the Brown Gentleman have been facing each other for almost a century.' },

fab:{ name:'The first little factory', short:'First factory', yearWhy:'Philips begins',
  walk:'Carry on down the Emmasingel to number 31: the Philips Museum.',
  tonnie:'This is where it started, in an old factory. No tower, no stadium. A workbench and a pump to suck the air out of glass.',
  info:[
   'On <b>15 May 1891</b> Gerard Philips started a light bulb factory here with his father’s money. Eindhoven had about 4,500 inhabitants then. Land and labour were cheap.',

frits:{ name:'Mr Frits on the Markt', short:'Mr Frits', yearWhy:'Frits Philips is born',

   hints:['Subtract the first year from the second.','He lived from 1905 to 2005.']},
  after:'A hundred years. He saw the light bulb, the radio, the television, the cassette and the CD all from close by.' },

kerk:{ name:'St Catherine’s Church', short:'St Catherine’s', yearWhy:'St Catherine’s Church is completed',
  walk:'From the Markt take the Rechtestraat south. At the end you’ll see two church towers.',
  tonnie:'Take a good look at those two towers. My mother used to say: even twins are never the same.',
  info:[
   'This neo-Gothic church, the Catharinakerk, was built between <b>1859 and 1867</b>. So it was already standing when Philips had yet to begin and Eindhoven was a town of a few thousand people.',
   'The architect looked to French cathedrals such as Chartres and Reims. The two towers are deliberately <b>not identical</b>. Spot the differences.',
   'It was one of his early major works. Afterwards he became the best-known architect in the Netherlands.'],
  puzzle:{type:'choice', q:'The architect is Pierre Cuypers. Which two buildings in Amsterdam, which almost every tourist passes, did he later design too?',
   options:['The Royal Palace on Dam Square and the Westerkerk','The Rijksmuseum and Central Station','The Concertgebouw and the Stedelijk Museum','The Stock Exchange and the Tuschinski cinema'], correct:1,
   hints:['One of them is full of Rembrandts.','At the other you get off the train.']},
  after:'The Rijksmuseum and Amsterdam Central Station. Eindhoven had its Cuypers first.' },

monu:{ name:'The Liberation Monument', short:'Liberation Monument', yearWhy:'Eindhoven is liberated',
  walk:'From the church walk west to the Stadhuisplein, the town hall square. The bronze monument stands on the square.',
  tonnie:'That evening we put everything that gave light in the window. After four years of blackout.',
  info:[
   'On <b>18 September 1944</b> the American 101st Airborne Division liberated the city, as part of Operation Market Garden. The monument by Paul Grégoire was unveiled exactly ten years later.',
   'Every year on 18 September the <b>liberation flame</b> arrives here, fetched by cyclists from Bayeux in Normandy. The mayor lights the torch with it. That is also the starting signal for the <b>Lichtjesroute</b>: 22 kilometres of light ornaments through the city.',
   'Around the monument are the names of Eindhoven’s war victims. In 2023 it turned out that SS men and Dutch Nazi party members were among them. Those 22 names were removed and 155 missing victims were added.'],
  puzzle:{type:'text', cipher:18, q:'Tonnie wrote one word here in code. He shifted every letter 18 places along the alphabet, after the day of the liberation. Shift it back.', code:'XJWWVGE', accept:['freedom'], show:'FREEDOM',
   hints:['The X used to be an F.','Use the table below: find the code letter in the bottom row and read the letter above it.']},
  after:'Freedom. The tradition of the lights began in 1945, when residents put candles and lamps in their windows at the first commemoration.' },

dyn:{ name:'Dynamo', short:'Dynamo', yearWhy:'first Dynamo Open Air',
  walk:'Dynamo is on the Catharinaplein, right next to the church (number 21).',
  walkFrom:{frits:'From the Markt take the Rechtestraat south to the church with the two towers (by Pierre Cuypers, 1867). Dynamo is next to it, on the Catharinaplein.'},
  tonnie:'My grandson came home from here with ringing ears. I said: lad, I had that in the factory too, but I got paid for it.',
  info:[
   'Dynamo is Eindhoven’s youth centre. The rock club started in <b>1981</b>. The present building dates from 2005.',
   'For its fifth anniversary the club organised a festival in the car park in <b>1986</b>. 5,000 people came. That was the first <b>Dynamo Open Air</b>.',
   'In <b>1995</b> the festival was held at Welschap air base and drew 118,000 visitors. It is still the largest multi-day open-air festival the Netherlands has ever had. The roads around the city were gridlocked.'],
  puzzle:{type:'choice', q:'From car park in 1986 to air base in 1995. How many times bigger had the crowd become?',
   options:['About 6 times','About 12 times','Almost 24 times','Almost 48 times'], correct:2,
   hints:['118,000 divided by 5,000.','5,000 × 20 is 100,000. You’re just above that.']},
  after:'Almost 24 times. After that the festival had to shrink. Its successor is Dynamo Metalfest, held every year at the ice rink.' },

strat:{ name:'Stratumseind', short:'Stratumseind', yearWhy:'Stratumseind becomes a Living Lab',
  walk:'Stratumseind starts at the church. Walk the whole street, down to the water of the Dommel.',
  tonnie:'In the old days only the neighbours watched you stagger home. Now the lamp post watches too.',
  info:[
   'This is the longest pub street in the Netherlands: about 300 metres with some 50 bars. On a weekend night around 15,000 people come here.',
   'Since <b>2014</b> the street has also been a laboratory, the <b>Living Lab</b>. Sensors count visitors and measure sound.',
   'The best-known experiment is about light. Researchers from TU/e and Philips test here whether the colour and brightness of the street lighting can steer the mood when things threaten to get out of hand. Not everyone is happy with so much measuring; there is a lot of debate about privacy.'],
  puzzle:{type:'num', q:'Some 50 bars in 300 metres. On average, how many metres is it from one bar to the next?', answer:6,
   hints:['Divide the length by the number.','300 ÷ 50.']},
  after:'A bar every six metres. The street is named after the former village of Stratum, which became part of Eindhoven in 1920.' },

daf:{ name:'DAF Museum', short:'DAF', yearWhy:'Hub van Doorne opens his workshop',
  walk:'This is the longest stretch, a good ten minutes. Walk back towards the church and then head east, via the Ten Hagestraat and the Kanaalstraat to Tongelresestraat 27. Or follow the “Open in Maps” button.',
  tonnie:'Hub came to weld for us when we couldn’t do it ourselves. A blacksmith from Limburg. Later half the country drove his little cars.',
  info:[
   'On <b>1 April 1928</b> Hub van Doorne started a workshop here with four men, in a corner of a beer brewery.',
   'It was all down to a broken car. The brewer owned an American Stearns-Knight that nobody could get going, except Hub. The brewer then lent him 10,000 guilders and the space to start out on his own.',
   'At first he did welding and forging, for Philips too. The museum is in the old brewery, and the first workshop has been preserved.'],
  puzzle:{type:'text', q:'Today DAF stands for Van Doorne’s Automobiel Fabriek. But until 1949 the A stood for the Dutch word for something you tow behind a car. What is that thing called in English?', accept:['trailer','trailers','atrailer','aanhangwagen','aanhangwagens','aanhanger','semitrailer','traileraanhangwagen'], show:'Trailer (aanhangwagen)',
   hints:['Lorries come in two parts: the tractor unit and the …','It rhymes with “sailor”.']},
  after:'Van Doorne’s Aanhangwagen Fabriek, trailer factory, from 1932. In 1949 the first lorry arrived and the letters could stay. The passenger car with its clever automatic gearbox came later; that branch went to Volvo in 1975.' },

eff:{ name:'The Effenaar', short:'Effenaar', yearWhy:'the Effenaar begins',
  walk:'Walk back north along the Vestdijk and turn right into the Dommelstraat. The Effenaar is at the end.',
  walkFrom:{daf:'Walk back west along the Tongelresestraat, go north on the Vestdijk and turn right into the Dommelstraat. The Effenaar is at the end.'},
  tonnie:'First they wove linen here. Then for a while there was nothing. Then came boys with long hair and a key nobody had given them.',
  info:[
   'On this spot stood the linen factory <b>Van den Briel &amp; Verster</b>. When it fell empty, the city council bought the complex.',
   'In 1970 young people squatted the building and started an open youth centre. In <b>1971</b> it carried on as the <b>Effenaar</b>. The early years were all about social criticism; later it became one of the country’s major pop venues.',
   'In the old hall, which smelled of beer and cigarettes, the Red Hot Chili Peppers and Bauhaus played, among others. In 2005 the new building by architects MVRDV opened on the same spot: stacked boxes, with one hall for 1,300 and one for 400 visitors.'],
  puzzle:{type:'text', q:'A British punk band that made only one studio album also once stood in that old hall. Tonnie wrote the name down backwards.', code:'SLOTSIP XES', accept:['sexpistols','thesexpistols'], show:'Sex Pistols',
   hints:['Read from right to left.','The first three letters are S, E, X.']},
  after:'The Sex Pistols in a squatted linen factory in Eindhoven.' },

muur:{ name:'The factory wall and the Inkijkmuseum', short:'Factory wall', yearWhy:'the linen factory is founded',
  walk:'Right next to the Effenaar, at Dommelstraat 2A, a piece of old factory wall with an information board still stands, along with a small building.',
  tonnie:'Before the lamp, Eindhoven was all linen, cigars and matches. This wall still remembers.',
  info:[
   'The Van den Briel &amp; Verster linen factory was founded in <b>1849</b>, more than forty years before Philips. This is all that is left of the complex.',
   'The small building was the factory’s <b>wash house</b>. Later it served as a bicycle shed for the police, among other things, and belonged to the Effenaar.',
   'Since 2004 it has been the <b>Inkijkmuseum</b>, the “look-in museum”. You don’t go inside: you look through the windows from the street at changing exhibitions.'],
  puzzle:{type:'num', q:'Find the year the wall was built on the information board. How many years had the factory existed by then?', answer:39,
   hints:['The factory dates from 1849.','The wall dates from 1888.']},
  after:'Thirty-nine years. Have a look through the wash house windows too.' },

silly:{ name:'The Silly Walks tunnel', short:'Silly Walks', yearWhy:'tunnel opened by John Cleese',
  walk:'Follow the path north along the Dommel. It dips under the railway: the Dommel tunnel.',
  tonnie:'I’ve walked properly all my life. Here you don’t have to.',
  info:[
   'This tunnel for cyclists and pedestrians links the city centre with the TU/e campus. It is 130 metres long.',
   'In <b>April 2016</b> Niels van Swaemen and Kasper van Leek of Studio Giftig painted the wall full of the walks from Monty Python’s sketch <i>The Ministry of Silly Walks</i>.',
   '<b>John Cleese</b> came to open the tunnel himself. Hundreds of people turned up. He asked them whether they really had nothing better to do that day.'],
  puzzle:{type:'num', q:'Walk through the tunnel, and do at least ten steps as a silly walk. A sum for the way: the tunnel is 130 metres. How many solemn paces of 65 centimetres do you need to reach the other end?', answer:200,
   hints:['130 metres is 13,000 centimetres.','13,000 ÷ 65.']},
  after:'Two hundred paces. The city council calls places like this “blijmakers”: things that make you happy.' },

ath:{ name:'The TU/e nuclear reactor', short:'Reactor', yearWhy:'reactor closed for good',
  walk:'After the tunnel you walk onto the campus. Look for the building called <b>Athene</b>, on the south side of the campus near the Helix and Matrix buildings. It is on the campus signs.',
  tonnie:'They said it was safe. I took the long way round all the same.',
  info:[
   'Eindhoven’s technical college, now the university TU/e, had its <b>own nuclear reactor</b>: ATHENE. From 1960 rector Posthumus wanted one for teaching and research. The design came from the Dutch reactor centre in Petten.',
   'Construction started in 1966 and by early 1969 the reactor was running. Just a year and a half later the national advisory council on nuclear energy recommended closing it: it contributed too little to science. After <b>May 1973</b> it was over.',
   'Its power was very low and it had run only briefly, so hardly any contaminated material was left. The one and a half kilos of highly enriched uranium went to Mol in Belgium. The building is still called Athene.'],
  puzzle:{type:'num', q:'A sum from the reactor classroom. A source emits 1,600 units. Every 4 years that halves. After how many years are 100 left?', answer:16,
   hints:['1,600 → 800 → 400 → …','You have to halve four times. Four times 4 years.']},
  after:'Sixteen years. Nuclear research hasn’t left the campus: at the DIFFER institute they now work on nuclear fusion. Ready for a break? A little further on, in the Luna building, are student café Hubble and the campus supermarket. They are on the map.' },

sta:{ name:'The station and Anton Philips', short:'Station', yearWhy:'the station opens',
  walk:'Walk via the Dommelstraat and the Stationsweg to the Stationsplein. Stand in front of the station, by the statue.',
  walkFrom:{ath:'Walk back through the tunnel and then via the Dommelstraat and the Stationsweg to the Stationsplein. Stand in front of the station, by the statue.',
            silly:'Walk back and go via the Dommelstraat and the Stationsweg to the Stationsplein. Stand in front of the station, by the statue.'},
  tonnie:'See it? The clock is the tuning dial, the tower the loudspeaker. Everyone here swears the station is a radio.',
  info:[
   'The station dates from <b>1956</b> and was designed by Koen van der Gaast. Take a few steps back and it really does look like an old Philips radio.',
   'Only: it isn’t true. The radio model the station resembles only came on the market years after the design. It is a stubborn and much-loved <b>urban myth</b>.',
   'The statue is of <b>Anton Philips</b> (1874–1951), a gift from the city for his 75th birthday. He stands with his back to the station. Under Anton, Philips started making radios in 1927; five years later it was the largest radio manufacturer in the world.'],
  puzzle:{type:'text', morse:true, q:'Radio began with Morse. This is the last thread in Tonnie’s notebook. Which word does it spell?', code:'·−··  ··  −−·  ····  −', accept:['light'], show:'LIGHT',

};

/* ---------- hulpjes ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function dist(a,b){ const R=6371000, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function routeKm(key){ const ids=ROUTES[key].stops; let d=0; for(let i=1;i<ids.length;i++) d+=dist(STOPS[ids[i-1]],STOPS[ids[i]]);
  d+=dist(STOPS[ids[ids.length-1]],STOPS.bk); return d*1.3/1000; }       // 1,3 = omlopen t.o.v. hemelsbreed
function letters(key){ const ids=[...ROUTES[key].stops].sort((a,b)=>STOPS[a].year-STOPS[b].year); const m={}; ids.forEach((id,i)=>m[id]=ROUTES[key].word[i]); return {order:ids, map:m}; }

/* ---------- toestand ---------- */
const KEY='gloeidraad.en.v1';
let S = { route:null, i:0, phase:'start', done:{}, hints:0, helped:0, t0:0, fin:0, miss:0 };
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const o=JSON.parse(localStorage.getItem(KEY)); if(o && o.route && ROUTES[o.route]) S=Object.assign(S,o); }catch(e){} }
const cur = () => STOPS[ROUTES[S.route].stops[S.i]];
const curId = () => ROUTES[S.route].stops[S.i];

/* ---------- gps (werkt alleen waar de browser het toestaat) ---------- */
let pos=null, gpsOn=false, gpsId=null, gpsMsg='';
function gpsUpd(){ const el=$('#afst'); if(el) el.innerHTML=afstTxt(); redrawAll(); }
function startGps(){
  if(gpsOn) return;
  if(!navigator.geolocation){ gpsMsg='This browser doesn’t share a location. The walk works without it too.'; gpsUpd(); return; }
  gpsOn=true; gpsMsg='Finding your location…'; gpsUpd();
  try{ gpsId=navigator.geolocation.watchPosition(p=>{ pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0}; gpsMsg=''; gpsUpd(); },
    e=>{ pos=null; gpsOn=false; try{ navigator.geolocation.clearWatch(gpsId); }catch(_){ }
      gpsMsg = e && e.code===1 ? 'Location is blocked for this site. Allow location in your browser, then tap ◎ on the map.'
             : e && e.code===3 ? 'No location found. Tap ◎ on the map to try again.'
             : 'Your location can’t be determined right now. Tap ◎ on the map to try again.';
      gpsUpd(); }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000}); }
  catch(e){ gpsOn=false; gpsMsg='Your location can’t be determined right now. Tap ◎ on the map to try again.'; gpsUpd(); } }
function verTxt(){ return 'You are about '+Math.round(dist(pos,{lat:51.4410,lng:5.4790})/1000)+' km from Eindhoven city centre. Your dot is off the map; the walk works without it too.'; }
function afstTxt(){ if(!pos) return gpsMsg ? '<span class="dim">'+gpsMsg+'</span>' : ''; const d=dist(pos,cur()); if(d>5000) return '<span class="dim">'+verTxt()+'</span>'; return d<35 ? '<b style="color:var(--ok)">You’re (almost) there.</b>' : 'About <b>'+(Math.round(d/10)*10)+' metres</b> to go, as the crow flies.'; }

function groep(id){ return ROUTES.k.stops.includes(id)?'k':ROUTES.m.stops.includes(id)?'m':'l'; }
const GKLEUR={k:'#ffb84a',m:'#ff7fb0',l:'#6fc3ff'};

/* ---------- echte kaart: OpenStreetMap-vectortegels via shared/tiles.js, anders getekend ---------- */
const ORG={lat:51.4410, lon:5.4790}, KX=111320*Math.cos(ORG.lat*Math.PI/180), KY=110540;
const mX=lng=>(lng-ORG.lon)*KX, mY=lat=>-(lat-ORG.lat)*KY;
const RAIL=[[51.4426,5.4655],[51.4430,5.4740],[51.4432,5.4795],[51.4437,5.4850],[51.4446,5.4930]];
const DOMMEL=[[51.4338,5.4816],[51.4352,5.4812],[51.4370,5.4838],[51.4398,5.4852],[51.4420,5.4853],[51.4440,5.4853],[51.4458,5.4842],[51.4478,5.4822]];
const STREETS=[
 ['Emmasingel',[[51.4416,5.4753],[51.4398,5.4751],[51.4386,5.4756],[51.4376,5.4762]]],
 ['Mathildelaan',[[51.4416,5.4753],[51.4421,5.4705],[51.4424,5.4662]]],
 ['Demer',[[51.4418,5.4774],[51.4392,5.4782]]],
 ['Rechtestraat',[[51.4392,5.4782],[51.4372,5.4794]]],
 ['Stratumseind',[[51.4370,5.4800],[51.4347,5.4809]]],
 ['Vestdijk',[[51.4424,5.4812],[51.4398,5.4815],[51.4372,5.4820],[51.4350,5.4824]]],
 ['Stationsplein',[[51.4424,5.4770],[51.4424,5.4812]]],
 ['Dommelstraat',[[51.4424,5.4812],[51.4419,5.4834],[51.4416,5.4847]]],
 ['Ten Hagestraat',[[51.4386,5.4817],[51.4384,5.4862]]],
 ['Tongelresestraat',[[51.4384,5.4862],[51.4374,5.4885],[51.4371,5.4925]]],
 ['Wal',[[51.4376,5.4762],[51.4364,5.4776],[51.4352,5.4800]]],
 ['Kennedylaan',[[51.4441,5.4800],[51.4478,5.4801]]]
];
const flat=a=>{ const o=[]; a.forEach(p=>o.push(mX(p[1]),mY(p[0]))); return o; };
const DRAWN={ areas:[], roads:STREETS.map(st=>({p:flat(st[1]),w:3,n:st[0]})), river:flat(DOMMEL) };
let WORLD=null, worldState='idle';           // idle · loading · ok · fail
const LIVE=new Set();                         // kaarten die nu op het scherm staan
function redrawAll(){ LIVE.forEach(m=>{ if(document.body.contains(m.cv)) m.draw(); else LIVE.delete(m); }); }
function prepWorld(w){
  const areas=w.ways.filter(x=>x.w==='water'||x.w==='park'), roads=w.ways.filter(x=>typeof x.w==='number').sort((a,b)=>a.w-b.w);
  roads.forEach(r=>{ let L=0; for(let k=0;k+3<r.p.length;k+=2) L+=Math.hypot(r.p[k+2]-r.p[k],r.p[k+3]-r.p[k+1]); r.len=L; });
  return {areas, roads, river:null};
}
function loadWorld(){
  if(worldState!=='idle') return;
  if(!window.MW || !MW.Tiles || !window.fetch){ worldState='fail'; return; }
  worldState='loading';
  MW.Tiles.world({lat:ORG.lat, lon:ORG.lon, R:750, ms:12000}).then(w=>{ if(!w || !w.ways || w.ways.length<20) throw new Error('leeg'); WORLD=prepWorld(w); worldState='ok'; redrawAll(); })
    .catch(()=>{ worldState='fail'; redrawAll(); });
}
/* makeMap(host,{h,focus}) – h: hoogte (css), focus: 'route' | 'cur' | 'all' */
function makeMap(host, opt){
  opt=opt||{}; loadWorld(); const RT=()=>opt.noRoute?null:S.route;
  host.innerHTML='<div class="mapbox" style="height:'+(opt.h||'52vh')+'"><canvas aria-label="Map of Eindhoven city centre with the stops of the walk"></canvas>'+
    '<div class="mapbtns"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" aria-label="Whole route">⤢</button><button data-z="me" aria-label="My location">◎</button></div></div>';
  const box=host.firstChild, cv=box.querySelector('canvas'), cx=cv.getContext('2d');
  let cw=0, ch=0, dpr=1, V={s:.3,x:0,y:0}, raf=0;
  const sx=x=>(x-V.x)*V.s+cw/2, sy=y=>(y-V.y)*V.s+ch/2;
  const routeIds=()=> RT() ? ROUTES[RT()].stops : Object.keys(STOPS);
  function size(){ dpr=window.devicePixelRatio||1; cw=box.clientWidth; ch=box.clientHeight; cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); }
  function fit(pts, pad){ if(!pts.length) return; const xs=pts.map(p=>mX(p.lng)), ys=pts.map(p=>mY(p.lat)); pad=pad||46;
    const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    V.s=Math.max(.12,Math.min(1.6, Math.min((cw-2*pad-44)/Math.max(60,x1-x0),(ch-2*pad)/Math.max(60,y1-y0)))); V.x=(x0+x1)/2+22/V.s; V.y=(y0+y1)/2; }
  function refit(){ const ids=routeIds();
    if(opt.focus==='cur' && RT()){ const c=cur(), prev=S.i>0?STOPS[ids[S.i-1]]:(pos&&dist(pos,c)<2500?pos:c); fit([c,prev],70); if(V.s>1.1) V.s=1.1; }
    else if(opt.focus==='all') fit(Object.values(STOPS));
    else fit(ids.map(id=>STOPS[id])); }
  function poly(p){ cx.beginPath(); for(let k=0;k<p.length;k+=2){ const X=sx(p[k]), Y=sy(p[k+1]); k?cx.lineTo(X,Y):cx.moveTo(X,Y); } }
  function label(txt,x,y,font,fill,align){ cx.font=font; cx.textAlign=align||'center'; cx.lineJoin='round'; cx.lineWidth=3.5; cx.strokeStyle='#141826'; cx.strokeText(txt,x,y); cx.fillStyle=fill; cx.fillText(txt,x,y); }
  function draw(){ raf=0; if(!cw) size(); if(!cw) return;
    const Wd=WORLD||DRAWN, real=!!WORLD;
    cx.setTransform(dpr,0,0,dpr,0,0); cx.fillStyle='#141826'; cx.fillRect(0,0,cw,ch); cx.lineCap='round'; cx.lineJoin='round';
    Wd.areas.forEach(a=>{ poly(a.p); cx.closePath(); cx.fillStyle=a.w==='water'?'#1b4460':'#1c3528'; cx.fill(); });
    if(Wd.river){ poly(Wd.river); cx.strokeStyle='#1b4460'; cx.lineWidth=Math.max(4,14*V.s); cx.stroke(); }
    poly(flat(RAIL)); cx.strokeStyle='#6a6f85'; cx.lineWidth=Math.max(2,9*V.s); cx.stroke(); cx.strokeStyle='#141826'; cx.lineWidth=Math.max(1,4*V.s); cx.setLineDash([7,7]); cx.stroke(); cx.setLineDash([]);
    // straten: eerst de rand, dan de vulling, zodat kruisingen in elkaar lopen
    const WID={1:2.2,2:6.5,3:11}, COL={1:'#39405a',2:'#4a5270',3:'#687196'};
    [1,2,3].forEach(w=>{ if(w===1 && V.s<.3) return; cx.strokeStyle=COL[w]; cx.lineWidth=Math.max(w===1?1:1.6, WID[w]*V.s);
      Wd.roads.forEach(r=>{ if(r.w!==w) return; poly(r.p); cx.stroke(); }); });
    // straatnamen
    if(V.s>=.3){ const used=[], seen={};
      const cand=Wd.roads.filter(r=>r.n && r.w>=(V.s>=.6?2:3)).sort((a,b)=>(b.w-a.w)||((b.len||0)-(a.len||0)));
      cx.font='500 11px system-ui,sans-serif';
      cand.forEach(r=>{ const n=r.p.length/2; if(n<2) return; const k=Math.max(0,Math.min(n-2,Math.floor(n/2)-1))*2;
        const ax=sx(r.p[k]), ay=sy(r.p[k+1]), bx=sx(r.p[k+2]), by=sy(r.p[k+3]), mx=(ax+bx)/2, my=(ay+by)/2;
        if(mx<20||my<14||mx>cw-20||my>ch-14) return;
        const tw=cx.measureText(r.n).width; if((r.len||9999)*V.s<tw*.9) return;
        const key=r.n+'|'+Math.round(mx/190)+'|'+Math.round(my/190); if(seen[key]) return;
        for(const u of used) if(Math.abs(u[0]-mx)<(u[2]+tw)/2+6 && Math.abs(u[1]-my)<15) return;
        seen[key]=1; used.push([mx,my,tw]);
        let ang=Math.atan2(by-ay,bx-ax); if(ang>Math.PI/2) ang-=Math.PI; if(ang<-Math.PI/2) ang+=Math.PI;
        cx.save(); cx.translate(mx,my); cx.rotate(ang); label(r.n,0,4,'500 11px system-ui,sans-serif','#b9bfd4'); cx.restore(); }); }
    // route (hemelsbreed, dun) alleen in een gekozen wandeling
    const ids=routeIds();
    if(RT()){ cx.beginPath(); ids.concat(['bk']).forEach((id,i)=>{ const p=STOPS[id]; i?cx.lineTo(sx(mX(p.lng)),sy(mY(p.lat))):cx.moveTo(sx(mX(p.lng)),sy(mY(p.lat))); });
      cx.strokeStyle='rgba(255,184,74,.38)'; cx.lineWidth=2; cx.setLineDash([2,7]); cx.stroke(); cx.setLineDash([]); }
    // weetjes
    WEETJES.forEach(w=>{ const X=sx(mX(w.lng)), Y=sy(mY(w.lat)); cx.beginPath(); cx.arc(X,Y,8,0,7); cx.fillStyle='#16223a'; cx.fill(); cx.strokeStyle='#9fd0ff'; cx.lineWidth=1.6; cx.stroke();
      cx.font='italic 700 11px Georgia,serif'; cx.textAlign='center'; cx.fillStyle='#cfe6ff'; cx.fillText('i',X,Y+4);
      if(V.s>=.75) label(w.name,X,Y+21,'500 10.5px system-ui,sans-serif','#9fd0ff'); });
    // plekken
    const walking=RT() && !['start','finale','end','back'].includes(S.phase);
    const pr=Math.max(7.5,Math.min(12,6+V.s*11)), boxes=[], todo=[];
    Object.keys(STOPS).forEach(id=>{ const p=STOPS[id], X=sx(mX(p.lng)), Y=sy(mY(p.lat)), inR=ids.includes(id), n=ids.indexOf(id), done=RT()&&S.done[id], isCur=walking&&ids[S.i]===id;
      const col=RT()?'#ffb84a':GKLEUR[groep(id)];
      cx.globalAlpha=inR?1:.35;
      if(isCur){ cx.beginPath(); cx.arc(X,Y,pr+7,0,7); cx.fillStyle='rgba(255,255,255,.14)'; cx.fill(); cx.strokeStyle='#fff'; cx.lineWidth=2.5; cx.stroke(); }
      cx.beginPath(); cx.arc(X,Y,pr,0,7); cx.fillStyle=(done||!RT())?col:'#1f2333'; cx.fill(); cx.strokeStyle=col; cx.lineWidth=2.5; cx.stroke();
      cx.font='700 '+(pr>10?12:10)+'px system-ui,sans-serif'; cx.textAlign='center'; cx.fillStyle=(done||!RT())?'#2a1700':'#f3ecdc'; cx.fillText(RT()&&inR?String(n+1):(id==='bk'?'★':''),X,Y+(pr>10?4.5:3.5));
      cx.globalAlpha=1;
      if(inR) todo.push({id:id,X:X,Y:Y,pri:isCur?0:(id==='bk'?1:2)}); });
    // namen: de huidige plek altijd, de rest alleen waar ruimte is
    cx.font='700 12px system-ui,sans-serif';
    Object.values(STOPS).concat(WEETJES).forEach(q=>boxes.push([sx(mX(q.lng))-pr,sy(mY(q.lat))-pr,2*pr,2*pr]));
    todo.sort((a,b)=>a.pri-b.pri).forEach(t=>{ const tw=cx.measureText(NAAM[t.id]).width, bx=t.X-tw/2-3, by=t.Y-pr-19;
      if(t.pri>0){ if(bx<2||bx+tw+6>cw-2||by<2) return; for(const q of boxes) if(bx<q[0]+q[2] && bx+tw+6>q[0] && by<q[1]+q[3] && by+16>q[1]) return; }
      boxes.push([bx,by,tw+6,16]); label(NAAM[t.id],t.X,t.Y-pr-6,'700 12px system-ui,sans-serif','#fff'); });
    // jij
    if(pos){ const X=sx(mX(pos.lng)), Y=sy(mY(pos.lat)); if(pos.acc){ cx.beginPath(); cx.arc(X,Y,Math.min(120,pos.acc*V.s),0,7); cx.fillStyle='rgba(74,163,255,.14)'; cx.fill(); }
      cx.beginPath(); cx.arc(X,Y,7,0,7); cx.fillStyle='#4aa3ff'; cx.fill(); cx.strokeStyle='#fff'; cx.lineWidth=2; cx.stroke(); }
    // schaal, noorden, bron
    const m=[50,100,200,500].find(v=>v*V.s>=46)||500; cx.strokeStyle='#cfc9b8'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(10,ch-12); cx.lineTo(10+m*V.s,ch-12); cx.stroke();
    cx.font='500 10px system-ui,sans-serif'; cx.textAlign='left'; cx.fillStyle='#cfc9b8'; cx.fillText(m+' m',10,ch-17); cx.fillText('N ↑',10,16);
    cx.textAlign='right'; cx.globalAlpha=.75;
    cx.fillText(real ? MW.Tiles.attr : worldState==='loading' ? 'Loading map…' : 'Sketch map (map data not loaded)', cw-8, ch-6); cx.globalAlpha=1;
  }
  const ask=()=>{ if(!raf) raf=requestAnimationFrame(draw); };
  // slepen, knijpen, tikken
  const pts=new Map(); let moved=false, pinch=0;
  cv.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; try{cv.setPointerCapture(e.pointerId)}catch(_){ } if(pts.size===2){ const a=[...pts.values()]; pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); } });
  cv.addEventListener('pointermove',e=>{ const p=pts.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y;
    if(pts.size===1){ if(!moved && Math.hypot(dx,dy)<7) return; moved=true; V.x-=dx/V.s; V.y-=dy/V.s; p.x=e.clientX; p.y=e.clientY; ask(); }
    else if(pts.size===2){ p.x=e.clientX; p.y=e.clientY; moved=true; const a=[...pts.values()], d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); if(pinch>0){ V.s=Math.max(.1,Math.min(4,V.s*d/pinch)); } pinch=d; ask(); } });
  const up=e=>{ const had=pts.has(e.pointerId); pts.delete(e.pointerId); if(pts.size<2) pinch=0; if(!had || moved || pts.size) return;
    const b=cv.getBoundingClientRect(), px=e.clientX-b.left, py=e.clientY-b.top;
    if(MOVE){ const id=MOVE; MOVE=null; const lng=ORG.lon+((px-cw/2)/V.s+V.x)/KX, lat=ORG.lat-((py-ch/2)/V.s+V.y)/KY; setPin(id,lat,lng); ask(); return; }
    let best=null, bd=26;
    Object.keys(STOPS).forEach(id=>{ const d=Math.hypot(sx(mX(STOPS[id].lng))-px, sy(mY(STOPS[id].lat))-py); if(d<bd){ bd=d; best={stop:id}; } });
    WEETJES.forEach(w=>{ const d=Math.hypot(sx(mX(w.lng))-px, sy(mY(w.lat))-py); if(d<bd-4){ bd=d; best={w:w}; } });
    if(best) tapPoint(best); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); pinch=0; });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); V.s=Math.max(.1,Math.min(4,V.s*(e.deltaY<0?1.2:1/1.2))); ask(); },{passive:false});
  box.querySelectorAll('.mapbtns button').forEach(b=>b.onclick=()=>{ const z=b.dataset.z;
    if(z==='in') V.s=Math.min(4,V.s*1.4); if(z==='out') V.s=Math.max(.1,V.s/1.4); if(z==='fit') fit(routeIds().map(id=>STOPS[id]));
    if(z==='me'){ if(pos){ if(dist(pos,{lat:ORG.lat,lng:ORG.lon})>3000) toast(verTxt()); else { V.x=mX(pos.lng); V.y=mY(pos.lat); if(V.s<.6) V.s=.8; } } else { startGps(); toast(gpsMsg||'Finding your location…'); } } ask(); });
  const api={cv:cv, draw:ask};
  size(); refit(); draw(); LIVE.add(api);
  if(window.ResizeObserver) new ResizeObserver(()=>{ const w=box.clientWidth,h=box.clientHeight; if(w&&h&&(w!==cw||h!==ch)){ const first=!cw; size(); if(first) refit(); ask(); } }).observe(box);
  return api;
}
function kleurLegenda(){ return '<p class="small" style="margin:.5em 0 0"><span style="color:'+GKLEUR.k+'">●</span> in every walk &nbsp; <span style="color:'+GKLEUR.m+'">●</span> added from 1.5 hours &nbsp; <span style="color:'+GKLEUR.l+'">●</span> 2-hour walk only &nbsp; <span style="color:#9fd0ff">ⓘ</span> fun fact</p><p class="small dim" style="margin:.2em 0 0">Drag to move, pinch or use + and − to zoom. Tap a point for more.</p>'; }
function toast(t){ let e=$('#toast'); if(!e){ e=document.createElement('div'); e.id='toast'; document.body.appendChild(e); } e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',2600); }
function tapPoint(b){
  if(b.w){ openSheet('<p class="kicker" style="color:#9fd0ff">Fun fact</p><h2>'+b.w.name+'</h2><img class="pic" src="../img/'+b.w.id+'.webp" alt="" onerror="this.remove()">'+(b.w.q?'<div class="quote"><img class="ava" src="../img/tonnie.webp" alt="" onerror="this.remove()">“'+b.w.q+'”<small>FROM TONNIE’S NOTEBOOK</small></div>':'')+'<p>'+b.w.t+'</p><p class="small dim">No puzzle here. Have a look if it’s on your way.</p>'); return; }
  const id=b.stop, s=STOPS[id], inR=S.route && ROUTES[S.route].stops.includes(id), done=S.route && S.done[id];
  let h='<p class="kicker">'+(done?'Lamp lit · '+s.year : inR?'Stop '+(ROUTES[S.route].stops.indexOf(id)+1)+' of your walk' : S.route?'Not in this walk':'Stop on the walk')+'</p><h2>'+s.name+'</h2>';
  if(done || !S.route) h+='<ul class="facts">'+s.info.map(t=>'<li>'+t+'</li>').join('')+'</ul>';
  else h+='<div class="quote">“'+s.tonnie+'”<small>FROM TONNIE’S NOTEBOOK</small></div><p class="small dim">You get the full story and the puzzle when you’re there.</p>';
  h+='<a class="btn ghost" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+encodeURIComponent(s.maps)+'">Open in Maps</a>';
  if(TEST) h+='<button class="btn ghost" id="verpl">Test: move pin</button>';
  openSheet(h);
  if(TEST) $('#verpl').onclick=()=>{ sheet.style.display='none'; MOVE=id; toast('Tap the map where “'+s.short+'” should be.'); };
}
